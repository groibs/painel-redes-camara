name: Coleta pública das redes da Câmara

on:
  schedule:
    # UTC. Fora do início da hora para reduzir atrasos na fila do GitHub.
    - cron: "17,47 * * * *"
    # Verificação diária dedicada: 07:11 no horário de Brasília.
    - cron: "11 10 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/coleta-redes.yml"
      - "scripts/sync_social.py"
      - "api/social_public.py"
      - "collector/collector.py"
      - "tests/test_sync_social.py"
      - "tests/test_social_embed.py"
      - "scripts/check_social_freshness.py"
      - "requirements.txt"

permissions:
  contents: write

concurrency:
  group: camara-social-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Código dos coletores
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Snapshot persistente (branch social-data)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: social-data
          path: social-data
          persist-credentials: true

      - name: Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências dos coletores
        run: python -m pip install -r requirements.txt

      - name: Verificar timestamps, cache e variação em 24 horas
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Coletar, preservar valores anteriores e atualizar o histórico
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python scripts/sync_social.py \
            --previous social-data/social/snapshot.json \
            --history social-data/social/history.json \
            --output social-data/social/snapshot.json \
            --history-output social-data/social/history.json

      - name: Publicar snapshot na branch de dados
        run: |
          git -C social-data config user.name "github-actions[bot]"
          git -C social-data config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C social-data add social/snapshot.json social/history.json
          if git -C social-data diff --cached --quiet; then
            echo "Snapshot sem mudanças."
          else
            git -C social-data commit -m "data: atualiza redes oficiais"
            git -C social-data push origin HEAD:social-data
          fi

      - name: Auditar atualização diária de seguidores
        if: github.event_name == 'schedule' && github.event.schedule == '11 10 * * *'
        run: |
          python scripts/check_social_freshness.py \
            --snapshot social-data/social/snapshot.json
