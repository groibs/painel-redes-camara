name: Me Conta+ TikTok - levantamento
on:
  push:
    branches:
      - research/meconta-tiktok-20261021
    paths:
      - 'scripts/meconta_tiktok_collect.py'
      - 'scripts/meconta_tiktok_discover.py'
      - '.github/workflows/meconta_tiktok_collect.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install public profile extractor
        run: python -m pip install -q yt-dlp
      - name: Discover history through public profile sources
        run: python scripts/meconta_tiktok_discover.py
      - name: Collect public TikTok data
        run: python scripts/meconta_tiktok_collect.py
      - name: Commit collection result to isolated branch
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/meconta-tiktok/
          if ! git diff --cached --quiet; then
            git commit -m 'Save Me Conta+ TikTok metadata snapshot'
            git push
          fi